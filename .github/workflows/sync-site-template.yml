name: Sync site template

# Regenerates the GitHub Pages site template and pushes it to
# potatosalad775/modernGraphTool_site, the repository operators copy with
# "Use this template".
#
# Most of that template is `defaults/` verbatim, so without this it drifts
# every time a config option, demo measurement or theme token changes here.
#
# ── Required secret ──────────────────────────────────────────────────────
# SITE_TEMPLATE_TOKEN — a fine-grained PAT scoped to the template repository
# with `Contents: read and write`. GITHUB_TOKEN cannot push across repos.
# Without it this workflow fails at the push step; nothing else is affected.
#
# The template is a full regeneration, so anything committed directly to the
# template repo that this script does not produce is overwritten. Edit the
# sources here — `defaults/` and `site-template/` — not the template repo.

on:
  push:
    branches:
      - main
    paths:
      - 'defaults/**'
      - 'site-template/**'
      - 'scripts/build-site-template.js'
      - '.github/workflows/sync-site-template.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and diff only — do not push'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-site-template
  cancel-in-progress: false

env:
  TEMPLATE_REPO: potatosalad775/modernGraphTool_site

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # No `npm ci` — the script only uses node builtins, and installing the
      # full toolchain for a file copy is a minute we don't need to spend.
      - name: Build site template
        run: node scripts/build-site-template.js

      - name: Checkout template repository
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          token: ${{ secrets.SITE_TEMPLATE_TOKEN }}
          path: template-repo

      - name: Apply generated files
        if: ${{ !inputs.dry_run }}
        run: |
          # Replace tracked content wholesale so deletions in defaults/ propagate,
          # but keep .git/ and anything GitHub itself owns in that repo.
          find template-repo -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'CNAME' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +
          cp -r dist-site-template/. template-repo/
          echo "Template contents:"
          ls -A template-repo

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        working-directory: template-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Template already up to date — nothing to push."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "sync: update template from modernGraphTool@${GITHUB_SHA:0:7}

          Generated by scripts/build-site-template.js.
          Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — built but did not push. Generated files:"
            ls -A dist-site-template
          else
            echo "Synced to https://github.com/${TEMPLATE_REPO}"
          fi
