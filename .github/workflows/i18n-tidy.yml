name: i18n tidy

# Pushes an `npm run i18n:tidy` commit to a translation PR, so a Fink PR from a
# fork behind main stops re-adding keys main already has. Trigger it with a
# `/tidy` comment on the PR (repo owner, members and collaborators only), or
# from the Actions tab with the PR number.
#
# ── Required secret ──────────────────────────────────────────────────────
# I18N_TIDY_TOKEN — a classic PAT with the `public_repo` scope, from an
# account with write access here. GITHUB_TOKEN cannot push to a fork, even
# with "Allow edits by maintainers" ticked, and fine-grained PATs only reach
# repositories their owner owns, which a contributor's fork is not. Without it
# this workflow fails at the clone step; nothing else is affected.
#
# ── Why this is safe with a write token ──────────────────────────────────
# Comment-triggered runs use this file and the scripts as they are on main;
# a PR cannot change either. Nothing from the PR is executed: the job checks
# out main, copies in only the PR's locale and staging JSON (allow-listed by
# name, so no `.prettierrc.json` or `package.json` can steer Prettier into
# loading a plugin), tidies it with main's script and dependencies, and
# copies the result back. Every value the PR controls (branch name, repo
# name) reaches the shell through env, never through `${{ }}` in a script.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: i18n-tidy-${{ github.event.issue.number || inputs.pr }}

jobs:
  tidy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/tidy') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: >-
          gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions"
          -f content=eyes --silent || true

      - name: Look up the pull request
        id: pr
        run: |
          gh pr view "$PR" --json state,headRefName,headRefOid,headRepository,headRepositoryOwner,maintainerCanModify,isCrossRepository > pr.json
          state=$(jq -r .state pr.json)
          if [ "$state" != OPEN ]; then
            echo "::error::PR #$PR is $state."
            exit 1
          fi
          if [ "$(jq -r .isCrossRepository pr.json)" = true ] &&
             [ "$(jq -r .maintainerCanModify pr.json)" != true ]; then
            gh pr comment "$PR" --body "Can't push the tidy: this PR doesn't allow edits by maintainers. Tick **Allow edits by maintainers** in the PR sidebar, or run \`npm run i18n:tidy -- --base origin/main\` on the branch yourself."
            exit 1
          fi
          {
            echo "ref=$(jq -r .headRefName pr.json)"
            echo "sha=$(jq -r .headRefOid pr.json)"
            echo "repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check out main (trusted scripts)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Clone the PR branch
        env:
          TOKEN: ${{ secrets.I18N_TIDY_TOKEN }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          HEAD_REF: ${{ steps.pr.outputs.ref }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The I18N_TIDY_TOKEN secret is not set. See the header of i18n-tidy.yml."
            exit 1
          fi
          git clone --quiet --depth 1 --branch "$HEAD_REF" -- \
            "https://x-access-token:$TOKEN@github.com/$HEAD_REPO.git" pr
          if [ "$(git -C pr rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The PR branch moved while this ran. Comment /tidy again."
            exit 1
          fi

      # No npm cache: comment-triggered runs can't save one, and a job holding a
      # write token is better off not sharing a cache with other workflows.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # --ignore-scripts: the tidy only needs Prettier; `prepare` would compile
      # Paraglide and the browser installs are irrelevant here.
      - name: Install main's dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Tidy the PR's translation files
        id: tidy
        run: |
          # Locale and staging files only: `en.json`, `pt-BR.json`,
          # `_missing_translations_uk.json`. Regular files, no symlinks.
          is_messages_file() {
            local name
            name=$(basename "$1")
            [ -f "$1" ] && [ ! -L "$1" ] &&
              [[ "$name" =~ ^(_missing_translations_)?[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*\.json$ ]]
          }
          rm -f trusted/messages/*.json
          for f in pr/messages/*.json; do
            if is_messages_file "$f"; then cp "$f" trusted/messages/; fi
          done

          # HEAD is main here, so --base HEAD orders en.json like main's.
          set +e
          (cd trusted && node scripts/tidy-translations.js --base HEAD) 2>&1 | tee tidy.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # Write back only the files copied in above, including the ones the tidy deleted.
          for f in pr/messages/*.json; do
            if is_messages_file "$f" && [ ! -e "trusted/messages/$(basename "$f")" ]; then
              rm "$f"
            fi
          done
          cp trusted/messages/*.json pr/messages/

      - name: Commit and push
        id: push
        if: steps.tidy.outputs.status == '0'
        env:
          HEAD_REF: ${{ steps.pr.outputs.ref }}
        working-directory: pr
        run: |
          git add -A messages
          if git diff --cached --quiet; then
            echo "pushed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m 'i18n: tidy translation files'
          git push --quiet origin "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report on the PR
        if: always() && steps.tidy.outcome == 'success'
        env:
          STATUS: ${{ steps.tidy.outputs.status }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          # A zero-width space after @ keeps a key name from pinging anyone.
          log=$(sed 's/@/@\xe2\x80\x8b/g' tidy.log)
          if [ "$STATUS" != 0 ]; then
            head="The tidy stopped: a key appears twice with different values, so one has to be kept by hand. Nothing was pushed."
          elif [ "$PUSH_OUTCOME" != success ]; then
            head="The tidy ran but the push failed. See the [run log]($RUN_URL)."
          elif [ -n "$PUSHED" ]; then
            head="Pushed $PUSHED with the tidied translation files."
          else
            head="Nothing to tidy: the translation files are already in order."
          fi
          printf '%s\n\n<details><summary>i18n:tidy output</summary>\n\n```\n%s\n```\n\n</details>\n' \
            "$head" "$log" > body.md
          gh pr comment "$PR" --body-file body.md

      - name: Report a failure before the tidy ran
        if: failure() && steps.tidy.outcome != 'success' && steps.pr.outcome != 'failure'
        run: gh pr comment "$PR" --body "The tidy couldn't run. See the [run log]($RUN_URL)."
