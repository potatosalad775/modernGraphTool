<!doctype html>
<!--
  modernGraphTool — CDN Deployment Template

  This thin index.html loads the core application from a CDN while keeping
  your config, theme, and data files local on your server.

  Setup:
  1. Place this file as index.html on your web server
  2. Keep your config.js, theme.css, data/, and assets/ folders alongside it
  3. The app will auto-update when new versions are released

  To pin a specific major version, add CDN_MODE to your config.js:
    CDN_MODE: {
      MAJOR_VERSION: 1,
    },

  Local testing: serve this folder with any static server and visit the
  file by its literal name (e.g. http://localhost:3000/cdn-index.html).
  The loader auto-normalizes the URL so SvelteKit's router resolves to
  the root route. When running on localhost/127.0.0.1, the inline script
  below loads ./loader.js alongside this file (so you can iterate on
  loader changes without publishing). On any other hostname it pulls
  loader.js from the jsDelivr CDN.
-->
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

		<title>modernGraphTool</title>
		<meta name="title" content="modernGraphTool" />
		<meta property="og:title" content="modernGraphTool" />
		<meta
			name="description"
			content="View and compare frequency response graphs for earphones/headphones."
		/>
		<meta
			property="og:description"
			content="View and compare frequency response graphs for earphones/headphones."
		/>
		<meta property="og:url" content="" />
		<link rel="canonical" href="" />
		<link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
		<link rel="shortcut icon" href="./assets/favicon.ico" />
		<meta property="og:type" content="website" />
		<meta
			name="keywords"
			content="earphone,headphone,IEM,frequency response,graph,comparison,measurement,FR"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="mobileGraphTool" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
		<link rel="manifest" href="./assets/site.webmanifest" />

		<!--
			Pretendard Variable font (Korean-optimized, dynamic subset). Preloaded, then
			swapped to a stylesheet on load: a pending stylesheet holds back every classic
			script after it, config.js and the app boot included.
		-->
		<link
			rel="preload"
			as="style"
			crossorigin
			referrerpolicy="no-referrer"
			integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
			onload="
				this.onload = null;
				this.rel = 'stylesheet';
			"
		/>
		<!-- Local config and theme (your customizations) -->
		<script src="./config.js"></script>
		<!--
			Dark mode before first paint, so a dark-mode visitor never sees a light flash. Same
			precedence as settings-store.svelte.ts (stored choice, then
			INTERFACE.PREFERRED_DARK_MODE_THEME, then the OS): change them together. This script is
			byte-identical in src/app.html, cdn/cdn-index.html and site-template/index.html so one CSP
			script hash covers all three: edit all three or none.
		-->
		<script>
			(function () {
				var t = null;
				try {
					var k = ['gt-settings-theme', 'gt-theme'];
					for (var n = 0; n < 2 && !t; n++) {
						var v = localStorage.getItem(k[n]);
						if (v === 'light' || v === 'dark') t = v;
					}
				} catch (e) {}
				try {
					if (!t) {
						var i = (window.GRAPHTOOL_CONFIG || {}).INTERFACE;
						var c = i && i.PREFERRED_DARK_MODE_THEME;
						if (c == null) c = 'system';
						t =
							c === 'dark' ||
							(c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
								? 'dark'
								: 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
				} catch (e) {}
			})();
		</script>
		<link rel="stylesheet" href="./theme.css" />
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="app" style="display: contents"></div>
		<!-- modernGraphTool CDN loader — bootstraps the app from CDN -->
		<script>
			(function () {
				var h = location.hostname;
				var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '::1';
				var src = isLocal
					? './loader.js'
					: 'https://cdn.jsdelivr.net/gh/potatosalad775/modernGraphTool@cdn/loader.js';
				var s = document.createElement('script');
				s.src = src;
				document.body.appendChild(s);
			})();
		</script>
	</body>
</html>
