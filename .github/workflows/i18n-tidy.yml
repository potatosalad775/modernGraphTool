name: i18n tidy

# Pushes an `npm run i18n:tidy` commit to a translation PR, so a Fink PR from a
# fork behind main stops re-adding keys main already has. It runs by itself on
# every PR that touches messages/*.json; a `/tidy` comment on the PR (repo
# owner, members and collaborators only) or the Actions tab with the PR number
# runs it again by hand.
#
# An automatic run stays quiet when there is nothing to tidy. When the tidy
# can't finish (a key twice with different values, or a PR that refuses
# maintainer edits) it fails the check and keeps ONE comment up to date, so a
# contributor pushing fixes isn't answered once per push.
#
# `/apply` (or the "apply" box in the Actions tab) also runs `i18n:apply`
# first: it merges the `_missing_translations_*.json` staging files this PR
# changed into their locale files, then writes those staging files again with
# what is still untranslated. Never automatic: it rewrites the file the
# contributor is still editing, so "this translation is finished" stays a
# maintainer's call.
#
# ── Required secret ──────────────────────────────────────────────────────
# I18N_TIDY_TOKEN — a classic PAT with the `public_repo` scope, from an
# account with write access here. GITHUB_TOKEN cannot push to a fork, even
# with "Allow edits by maintainers" ticked, and fine-grained PATs only reach
# repositories their owner owns, which a contributor's fork is not. Without it
# this workflow fails at the clone step; nothing else is affected.
#
# ── Why this is safe with a write token ──────────────────────────────────
# `pull_request_target` and comment-triggered runs use this file and the
# scripts as they are on main; a PR cannot change either. Never switch the
# trigger to `pull_request`: a fork PR gets no secrets there, and a same-repo
# one would run the PR's copy of this file with the token.
# Nothing from the PR is executed: the job checks
# out main, copies in only the PR's locale and staging JSON (allow-listed by
# name, so no `.prettierrc.json` or `package.json` can steer Prettier into
# loading a plugin), tidies it with main's script and dependencies, and
# copies the result back. Every value the PR controls (branch name, repo
# name) reaches the shell through env, never through `${{ }}` in a script.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'messages/*.json'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      apply:
        description: 'Also merge the staging files into the locale files (i18n:apply)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: i18n-tidy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

jobs:
  tidy:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/tidy') ||
        startsWith(github.event.comment.body, '/apply')) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      AUTO: ${{ github.event_name == 'pull_request_target' }}
      APPLY: ${{ startsWith(github.event.comment.body, '/apply') || inputs.apply == true }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: >-
          gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions"
          -f content=eyes --silent || true

      - name: Look up the pull request
        id: pr
        run: |
          gh pr view "$PR" --json files,state,headRefName,headRefOid,headRepository,headRepositoryOwner,maintainerCanModify,isCrossRepository > pr.json
          state=$(jq -r .state pr.json)
          if [ "$state" != OPEN ]; then
            echo "::error::PR #$PR is $state."
            exit 1
          fi
          can_push=true
          if [ "$(jq -r .isCrossRepository pr.json)" = true ] &&
             [ "$(jq -r .maintainerCanModify pr.json)" != true ]; then
            # An automatic run still tidies a copy, to say whether one is needed.
            if [ "$AUTO" != true ]; then
              gh pr comment "$PR" --body "Can't push the tidy: this PR doesn't allow edits by maintainers. Tick **Allow edits by maintainers** in the PR sidebar, or run \`npm run i18n:tidy -- --base origin/main\` on the branch yourself."
              exit 1
            fi
            can_push=false
          fi
          {
            echo "can_push=$can_push"
            echo "ref=$(jq -r .headRefName pr.json)"
            echo "sha=$(jq -r .headRefOid pr.json)"
            echo "repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check out main (trusted scripts)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Clone the PR branch
        env:
          TOKEN: ${{ secrets.I18N_TIDY_TOKEN }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          HEAD_REF: ${{ steps.pr.outputs.ref }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The I18N_TIDY_TOKEN secret is not set. See the header of i18n-tidy.yml."
            exit 1
          fi
          git clone --quiet --depth 1 --branch "$HEAD_REF" -- \
            "https://x-access-token:$TOKEN@github.com/$HEAD_REPO.git" pr
          if [ "$(git -C pr rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The PR branch moved while this ran. The push that moved it starts a new run; otherwise comment /tidy."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: trusted/package-lock.json

      # --ignore-scripts: the tidy only needs Prettier; `prepare` would compile
      # Paraglide and the browser installs are irrelevant here.
      - name: Install main's dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Tidy the PR's translation files
        id: tidy
        run: |
          # Locale and staging files only: `en.json`, `pt-BR.json`,
          # `_missing_translations_uk.json`. Regular files, no symlinks.
          is_messages_file() {
            local name
            name=$(basename "$1")
            [ -f "$1" ] && [ ! -L "$1" ] &&
              [[ "$name" =~ ^(_missing_translations_)?[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*\.json$ ]]
          }
          rm -f trusted/messages/*.json
          for f in pr/messages/*.json; do
            if is_messages_file "$f"; then cp "$f" trusted/messages/; fi
          done

          # HEAD is main here, so --base HEAD orders en.json like main's.
          tidy() {
            (cd trusted && node scripts/tidy-translations.js --base HEAD) 2>&1 | tee -a tidy.log
            return "${PIPESTATUS[0]}"
          }
          set +e
          stage=tidy
          tidy
          status=$?
          # The tidy runs first because the apply reads with JSON.parse, which
          # would quietly pick one copy of a key that is there twice. It runs
          # again afterwards to put what the apply wrote in main's order.
          if [ "$APPLY" = true ] && [ "$status" = 0 ]; then
            stage=apply
            # The apply merges and deletes every staging file it finds, so the
            # ones this PR didn't change wait outside while it runs. The path
            # list is the PR's, and is only ever compared against.
            mkdir held
            applied=''
            for f in trusted/messages/_missing_translations_*.json; do
              [ -e "$f" ] || continue
              if jq -e --arg p "messages/$(basename "$f")" \
                'any(.files[]; .path == $p)' pr.json > /dev/null; then
                applied+="$(basename "$f")"$'\n'
              else
                mv "$f" held/
              fi
            done
            # --strict: a staging entry skipped for a mistake would be lost
            # with its file, so it stops the run instead. Nothing is pushed.
            printf '\n$ i18n:apply\n' >> tidy.log
            (cd trusted && node scripts/apply-translations.js --strict) 2>&1 | tee -a tidy.log
            status=${PIPESTATUS[0]}
            if [ "$status" = 0 ]; then
              # The second half of `npm run i18n:apply`: write the staging
              # files again with what is still untranslated. It writes one for
              # every locale, from this PR's en.json, so only those of the
              # locales just applied are kept. Its output lists every missing
              # key of every locale; that stays in this log, off the PR.
              (cd trusted && node scripts/check-translations.js --write)
              printf '\n$ i18n:missing\n' >> tidy.log
              for f in trusted/messages/_missing_translations_*.json; do
                [ -e "$f" ] || continue
                if ! grep -qxF "$(basename "$f")" <<< "$applied"; then rm "$f"; fi
              done
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                if [ -e "trusted/messages/$name" ]; then
                  echo "$name: written again with what is still untranslated" >> tidy.log
                else
                  echo "$name: nothing left to translate" >> tidy.log
                fi
              done <<< "$applied"
            fi
            find held -type f -exec mv {} trusted/messages/ \;
            if [ "$status" = 0 ]; then
              stage=tidy
              printf '\n$ i18n:tidy\n' >> tidy.log
              tidy
              status=$?
            fi
          fi
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

          # Write back only the files copied in above, including the ones the tidy deleted.
          for f in pr/messages/*.json; do
            if is_messages_file "$f" && [ ! -e "trusted/messages/$(basename "$f")" ]; then
              rm "$f"
            fi
          done
          cp trusted/messages/*.json pr/messages/

      - name: Commit and push
        id: push
        if: steps.tidy.outputs.status == '0'
        env:
          HEAD_REF: ${{ steps.pr.outputs.ref }}
          CAN_PUSH: ${{ steps.pr.outputs.can_push }}
        working-directory: pr
        run: |
          tidy_subject='i18n: tidy translation files'
          subject=$tidy_subject
          if [ "$APPLY" = true ]; then subject='i18n: apply translation staging files'; fi
          git add -A messages
          if git diff --cached --quiet; then
            echo "pushed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CAN_PUSH" != true ]; then
            echo "unpushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The push below starts the next automatic run. If the tidy ever
          # stopped being idempotent, the two would feed each other forever.
          if [ "$AUTO" = true ] && [ "$(git log -1 --format=%s)" = "$tidy_subject" ]; then
            echo "::error::The tidy commit itself still needs a tidy. Not pushing another one."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "$subject"
          git push --quiet origin "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report on the PR
        if: always() && steps.tidy.outcome == 'success'
        env:
          STATUS: ${{ steps.tidy.outputs.status }}
          STAGE: ${{ steps.tidy.outputs.stage }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          UNPUSHED: ${{ steps.push.outputs.unpushed }}
        run: |
          # A zero-width space after @ keeps a key name from pinging anyone.
          log=$(sed 's/@/@\xe2\x80\x8b/g' tidy.log)
          # open: the PR still needs someone to act. clean: nothing was wrong.
          open=true
          clean=false
          what=tidy
          if [ "$APPLY" = true ]; then what=apply; fi
          if [ "$STATUS" != 0 ] && [ "$STAGE" = apply ]; then
            head="The apply stopped and nothing was pushed: it would have dropped a translated entry along with its staging file. The output below names each one and what is wrong with it."
          elif [ "$STATUS" != 0 ]; then
            head="The tidy stopped: a key appears twice with different values, so one has to be kept by hand. Nothing was pushed."
          elif [ "$PUSH_OUTCOME" != success ]; then
            head="The $what ran but the push failed. See the [run log]($RUN_URL)."
          elif [ "$UNPUSHED" = true ]; then
            head="These translation files need a tidy, and it can't be pushed here: this PR doesn't allow edits by maintainers. Tick **Allow edits by maintainers** in the PR sidebar and push again (or ask a maintainer to comment \`/tidy\`), or run \`npm run i18n:tidy -- --base origin/main\` on the branch yourself."
          elif [ -n "$PUSHED" ]; then
            open=false
            head="Pushed $PUSHED with the tidied translation files."
            if [ "$APPLY" = true ]; then
              head="Pushed $PUSHED: the staging files are merged into the locale files. What is still untranslated stays in the staging file, as English."
            fi
          else
            open=false
            clean=true
            head="Nothing to tidy: the translation files are already in order."
            if [ "$APPLY" = true ]; then
              head="Nothing to apply: this PR has no staging file with a translation to merge, and the translation files are in order."
            fi
          fi
          # The marker finds the automatic runs' one comment again.
          marker='<!-- i18n-tidy:auto -->'
          printf '%s\n\n<details><summary>i18n:%s output</summary>\n\n```\n%s\n```\n\n</details>\n' \
            "$head" "$what" "$log" > body.md

          if [ "$AUTO" != true ]; then
            gh pr comment "$PR" --body-file body.md
            exit 0
          fi

          # An open problem goes into the one marked comment, and a later clean
          # run closes it there. A clean run with no such comment says nothing.
          # A pushed tidy is news, so it gets a comment of its own; the run its
          # push starts is the clean one.
          sticky=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" |
            head -n 1)
          if [ "$open" = true ] || { [ "$clean" = true ] && [ -n "$sticky" ]; }; then
            printf '\n%s\n' "$marker" >> body.md
            if [ -n "$sticky" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$sticky" -F body=@body.md --silent
            else
              gh pr comment "$PR" --body-file body.md
            fi
          elif [ "$clean" != true ]; then
            gh pr comment "$PR" --body-file body.md
          fi
          # Red check: the PR author sees it without reading the thread.
          if [ "$open" = true ]; then exit 1; fi

      - name: Report a failure before the tidy ran
        if: failure() && steps.tidy.outcome != 'success' && steps.pr.outcome != 'failure'
        run: gh pr comment "$PR" --body "The run couldn't start. See the [run log]($RUN_URL)."
