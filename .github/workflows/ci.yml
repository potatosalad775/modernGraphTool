name: CI

# Lint, typecheck, test and build on every PR and every push to main.
#
# The app is tested across browser engines, not operating systems: the build job
# boots the built output in Chromium, WebKit and Firefox.
#
# The quality job still has a Windows leg, for line endings only. The formatting
# drift this workflow exists to prevent was invisible on macOS/Linux and only
# showed up on a Windows checkout, because Git for Windows rewrites line endings
# unless .gitattributes pins them. That leg installs, lints and checks the tree is
# clean. It runs no typecheck and no tests: they ran the same specs in the same
# Chromium as the Linux leg, and never caught a Windows-only defect.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The root lint walks into docs/, and ESLint 10 resolves the config from each
      # linted file, so docs/eslint.config.js runs there with its own typescript-eslint
      # and its own tsconfig. Both have to resolve from docs/node_modules: without this
      # install, `astro/tsconfigs/strict` is missing and every docs .js/.mjs file fails
      # to parse.
      - name: Install docs dependencies
        working-directory: ./docs
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: npm run check

      - name: Install Playwright browser
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm run test

      - name: Translation status (informational)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm run i18n:check

      # A Fink PR from a fork behind main re-adds keys main already has, at a
      # different spot, and git merges both copies without a conflict. On a PR
      # this checkout is the merge result, so a duplicate here is one merging
      # would ship. JSON.parse silently keeps one copy, so nothing else notices.
      - name: No duplicate translation keys
        if: matrix.os == 'ubuntu-latest'
        run: npm run i18n:tidy -- --check --duplicates-only

      # Key order and stale staging entries: worth a note on the PR, not a red
      # build for a translator. The maintainer runs `npm run i18n:tidy` before merging.
      - name: Translation files tidy (informational)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm run i18n:tidy -- --check

      # Coverage runs the whole suite a second time. Blocking: the thresholds in vite.config.ts are a ratchet, and a PR
      # that drops below them has removed coverage that used to exist.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      # The line-ending guard, and the reason for the Windows leg: after a clean
      # checkout, an install and a lint (plus the tests on Linux), nothing tracked may
      # have changed. If .gitattributes ever stops pinning LF, the lint step or this
      # one fails on Windows and nowhere else.
      - name: Working tree must be clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after install + lint (+ test on Linux)."
            git status --porcelain
            git diff
            exit 1
          fi
          # Check the index (what got committed) and the working tree (what a checkout
          # produced) separately. A file can be LF in the index but CRLF on disk, which
          # is the exact state that makes Prettier fail on Windows and pass elsewhere.
          if git ls-files --eol | grep -qE 'i/crlf|w/crlf'; then
            echo "::error::CRLF line endings found. See .gitattributes."
            git ls-files --eol | grep -E 'i/crlf|w/crlf'
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # The unit suite never loads what `build` emits, so an adapter-static or
      # asset-copy regression is invisible to it. This boots the real dist/ in
      # Chromium, WebKit and Firefox, and fails on a console error, a graph that never
      # draws or an AutoEQ run that never answers. It is the only cross-engine test:
      # the component specs run in Chromium alone.
      # WebKit pulls about 185 apt packages. A slow mirror once held this step for
      # 24 minutes, so it fails fast and a rerun gets another runner.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Smoke test the built output (Chromium, WebKit, Firefox)
        run: npm run test:smoke

      - name: Build CDN distribution
        run: npm run build:cdn

      # deploy-gh-pages.yml publishes the docs site alongside the app on every push
      # to main. Building it here means a docs break is caught on the PR instead of
      # taking the deploy down.
      #
      # The specs run first: they cover the framework-free converters behind the
      # three interactive tools, which emit the config.js and phone_book.json
      # operators paste into live deployments. The tools' form components are
      # deliberately uncovered, so a mis-wired field shows up as a failing
      # round-trip assertion here rather than as a wrong file on someone's site.
      - name: Build docs
        working-directory: ./docs
        run: |
          npm ci
          npm test
          npm run build
