<!doctype html>
<!--
  modernGraphTool — GitHub Pages site template

  This is a thin entry point. The application itself loads from jsDelivr and
  updates itself when a new version is released — you never re-upload it.
  The files next to this one are yours to edit:

    config.js   your settings          theme.css   your colors
    data/       your measurements      assets/     your images

  Most operators only need to touch the <title> and the two <meta> descriptions
  below. Full docs:
  https://potatosalad775.github.io/modernGraphTool/docs/guide-for-admins/deployment/github-pages
-->
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<!--
			Content-Security-Policy, switched off. To switch it on, remove the comment marks around
			the <meta> below; it must stay above every script. The release build fills in the policy,
			including a hash for each inline script on this page, so an inline script you add or
			edit needs its own hash. → docs: guide-for-admins/deployment/security-headers
		-->
		<!-- <meta http-equiv="Content-Security-Policy" content="__CSP__" /> -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<!-- The loader's first request (versions.json) goes to GitHub, not jsDelivr -->
		<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

		<!-- ── Edit these to name your database ────────────────────────────── -->
		<title>modernGraphTool</title>
		<meta name="title" content="modernGraphTool" />
		<meta property="og:title" content="modernGraphTool" />
		<meta
			name="description"
			content="View and compare frequency response graphs for earphones/headphones."
		/>
		<meta
			property="og:description"
			content="View and compare frequency response graphs for earphones/headphones."
		/>
		<!-- ────────────────────────────────────────────────────────────────── -->

		<meta property="og:url" content="" />
		<link rel="canonical" href="" />
		<link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
		<link rel="shortcut icon" href="./assets/favicon.ico" />
		<meta property="og:type" content="website" />
		<meta
			name="keywords"
			content="earphone,headphone,IEM,frequency response,graph,comparison,measurement,FR"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="modernGraphTool" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
		<link rel="manifest" href="./assets/site.webmanifest" />

		<!--
			Pretendard Variable font (Korean-optimized, dynamic subset). Preloaded, then
			swapped to a stylesheet on load (by the script after it): a pending stylesheet holds back every classic
			script after it, config.js and the app boot included.
		-->
		<link
			rel="preload"
			as="style"
			crossorigin
			referrerpolicy="no-referrer"
			integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>
		<!--
			Not an `onload` attribute: a Content-Security-Policy can allow a script by hash, but
			not an inline handler. The script runs before the load event can fire. Byte-identical in
			all three shells, like the dark-mode script below.
		-->
		<script>
			(function (link) {
				link.addEventListener('load', function () {
					link.rel = 'stylesheet';
				});
			})(document.currentScript.previousElementSibling);
		</script>

		<!-- Your settings and colors -->
		<script src="./config.js"></script>
		<!--
			Dark mode before first paint, so a dark-mode visitor never sees a light flash. Same
			precedence as settings-store.svelte.ts (stored choice, then
			INTERFACE.PREFERRED_DARK_MODE_THEME, then the OS): change them together. This script is
			byte-identical in src/app.html, cdn/cdn-index.html and site-template/index.html so one CSP
			script hash covers all three: edit all three or none.
		-->
		<script>
			(function () {
				var t = null;
				try {
					var k = ['gt-settings-theme', 'gt-theme'];
					for (var n = 0; n < 2 && !t; n++) {
						var v = localStorage.getItem(k[n]);
						if (v === 'light' || v === 'dark') t = v;
					}
				} catch (e) {}
				try {
					if (!t) {
						var i = (window.GRAPHTOOL_CONFIG || {}).INTERFACE;
						var c = i && i.PREFERRED_DARK_MODE_THEME;
						if (c == null) c = 'system';
						t =
							c === 'dark' ||
							(c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
								? 'dark'
								: 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
				} catch (e) {}
			})();
		</script>
		<!--
			Ask for the phone book now, so the FR files can follow as soon as the app's first
			chunks run. See src/app.html; this script is byte-identical in all three shells.
		-->
		<script>
			(function () {
				try {
					var p = (window.GRAPHTOOL_CONFIG || {}).PATH;
					var l = document.createElement('link');
					l.rel = 'preload';
					l.as = 'fetch';
					l.crossOrigin = 'anonymous';
					l.href = (p && p.PHONE_BOOK) || '../../../data/phone_book.json';
					document.head.appendChild(l);
				} catch (e) {}
			})();
		</script>
		<link rel="stylesheet" href="./theme.css" />

		<!--
			GitHub Pages base-path auto-detect.

			A project site is served from a subdirectory named after the repository
			(username.github.io/my-repo/), and the app has to know that prefix or
			share links break. This works it out from the URL so you don't have to
			edit config.js when you name — or rename — your repository.

			It only runs on *.github.io, and only when config.js leaves BASE_PATH
			unset. Set CDN_MODE.BASE_PATH in config.js to override it (needed for a
			custom domain that serves the site from a subdirectory).
		-->
		<script>
			(function () {
				var cfg = (window.GRAPHTOOL_CONFIG = window.GRAPHTOOL_CONFIG || {});
				var cdn = (cfg.CDN_MODE = cfg.CDN_MODE || {});
				if (cdn.BASE_PATH != null) return;
				if (!/\.github\.io$/i.test(location.hostname)) return;
				var seg = location.pathname.split('/').filter(Boolean)[0];
				cdn.BASE_PATH = seg && !/\.html?$/i.test(seg) ? '/' + seg : '';
			})();
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="app" style="display: contents"></div>
		<script src="https://cdn.jsdelivr.net/gh/potatosalad775/modernGraphTool@cdn/loader.js"></script>
	</body>
</html>
