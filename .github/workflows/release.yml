name: Release

# Builds both full and CDN distributions and creates a GitHub Release with
# both zips attached. Does NOT publish to the cdn branch — see deploy.yml.

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (defaults to package.json version)'
        required: false
        type: string
      release_notes:
        description: 'Additional release notes (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (major: $MAJOR)"

      # Assembles the whole release body into a file, which the release step reads
      # via body_path. Nothing here may block the release: a missing or malformed
      # changelog entry only drops that one section.
      - name: Build release body
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTRA_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          : > release-body.md
          : > changelog-section.md

          if [ -f docs/src/content/docs/changelog.mdx ]; then
            awk -v ver="### v$VERSION" '
              $0 == ver { found=1; next }
              found && /^### v/ { exit }
              found { buf = buf $0 "\n" }
              END {
                gsub(/^\n+/, "", buf)
                gsub(/\n+$/, "", buf)
                # Trailing newline is required: without it the section would run
                # into whatever is appended next. Emit nothing at all when the
                # version has no entry, so [ -s ] below is a real test.
                if (buf != "") printf "%s\n", buf
              }
            ' docs/src/content/docs/changelog.mdx > changelog-section.md || true
          fi

          if [ -s changelog-section.md ]; then
            {
              echo "## Changelog"
              echo
              cat changelog-section.md
              echo
            } >> release-body.md
          else
            echo "::warning::No changelog.mdx entry found for v$VERSION — release body omits the Changelog section."
          fi

          if [ -n "$EXTRA_NOTES" ]; then
            {
              echo "## Notes"
              echo
              printf '%s\n\n' "$EXTRA_NOTES"
            } >> release-body.md
          fi

          # Quoted heredoc: the markdown table is full of backticks, which an
          # unquoted one would run as command substitution.
          sed "s/__VERSION__/$VERSION/g" >> release-body.md <<'DOWNLOADS'
          ## Downloads

          | Package | Description |
          |---------|-------------|
          | `modernGraphTool_v__VERSION___full.zip` | **Full distribution** — drop entire contents on your web server |
          | `modernGraphTool_v__VERSION___cdn.zip` | **CDN distribution** — lightweight package, app loaded from CDN |

          ### Full distribution
          Extract and upload everything to your web server. Self-contained, no external dependencies.

          ### CDN distribution
          Lightweight package for auto-updating deployments. The core application is loaded from
          `cdn.jsdelivr.net` — you only host your config, theme, and data files.

          See [CDN deployment docs](https://potatosalad775.github.io/modernGraphTool/docs) for setup.
          DOWNLOADS

      # ── Build full dist/ ──────────────────────────────────────────────
      - name: Build full distribution
        run: npm run build

      - name: Package full distribution
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-packages
          cd dist
          zip -r "../release-packages/modernGraphTool_v${VERSION}_full.zip" .
          cd ..
          echo "Full dist size:"
          du -sh dist/

      # ── Build CDN dist/ ──────────────────────────────────────────────
      - name: Build CDN distribution
        run: node scripts/build-cdn.js
        env:
          MGT_CDN_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@cdn/v${{ steps.version.outputs.version }}

      - name: Package CDN distribution
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # The CDN user package contains everything EXCEPT _app/ and index.html
          # (they get the app from the CDN instead). We rename cdn-index.html → index.html.
          mkdir -p dist-cdn-package
          # Copy user-configurable files
          cp dist-cdn/config.js dist-cdn-package/
          cp dist-cdn/theme.css dist-cdn-package/
          cp dist-cdn/.htaccess dist-cdn-package/ 2>/dev/null || true
          cp -r dist-cdn/data dist-cdn-package/ 2>/dev/null || true
          cp -r dist-cdn/assets dist-cdn-package/ 2>/dev/null || true
          # Use the thin CDN index.html
          cp dist-cdn/cdn-index.html dist-cdn-package/index.html

          cd dist-cdn-package
          zip -r "../release-packages/modernGraphTool_v${VERSION}_cdn.zip" .
          cd ..
          echo "CDN package size:"
          du -sh dist-cdn-package/

      # ── Create GitHub Release ────────────────────────────────────────
      # Guards against the body step having bailed out — body_path on a missing
      # file would fail the release.
      - name: Ensure release body exists
        run: '[ -f release-body.md ] || touch release-body.md'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-body.md
          files: release-packages/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ──────────────────────────────────────────────────────
      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          echo "Release complete!"
          echo ""
          echo "Version: v${VERSION}"
          echo "Release: https://github.com/${REPO}/releases/tag/v${VERSION}"
          echo ""
          echo "Packages:"
          ls -lh release-packages/
